name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "tools/**"
      - "mkdocs.yml"
      - "astrotools_adv/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            docs/requirements.txt
      - name: System libraries for Qt (offscreen platform)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -r requirements.txt -r docs/requirements.txt
      - name: Generate reference pages and screenshots from the running application
        run: python tools/build_reference.py
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
      - name: Build site (broken links fail the build)
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
