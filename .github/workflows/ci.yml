name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: System libraries for Qt (offscreen platform)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: python -m pip install -r requirements-dev.txt pytest-timeout
      - run: python -m pytest -q --timeout=300
        env:
          QT_QPA_PLATFORM: offscreen
          MPLBACKEND: Agg
