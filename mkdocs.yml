site_name: AstroTools-ADV
site_description: A PyQt5 desktop interface for astropy and astroquery.
site_url: https://jan-tdy.github.io/AstroTools-ADV/
repo_url: https://github.com/jan-tdy/AstroTools-ADV
repo_name: jan-tdy/AstroTools-ADV
edit_uri: edit/main/docs/
copyright: MIT licensed, &copy; 2026 Jan Dubovsky

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle: {icon: material/weather-sunny, name: Switch to light mode}
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

hooks:
  - tools/mkdocs_hooks.py

plugins:
  - search
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  scenarios/
  notes/
